# brand.yml — INFO 7375 Exercise 1, personal brand layer (Kanishk Singh)
# Rule of this file (the self-test): an attribute may live here ONLY if a
# resume.json entry backs it. No proof -> it's an aspiration -> gaps.md.
#
# The aspiration below is the BLEND I chose (2026-06-22): it opens in my own Part 1A voice
# ("turning complex ideas into products people actually use") AND stays sharp enough to derive
# a specific media ecosystem (the Step-3 trap test) — product company, new-grad pipeline,
# builder-proof. Both halves on purpose. This is mine. (Rubric line 4 satisfied.)

aspiration: >-
  I love turning complex ideas into products people actually use. Concretely: I'm becoming
  the full-stack and mobile engineer a product team trusts to take a feature from the
  React Native / React UI through a Node or Java backend to release — and to wire in the
  LLM / retrieval layer when the product needs it. I care about building things that work
  and solving the right problem, then growing into someone who leads that work end to end.
# Why this is sharp enough (the Step-3 trap test): it derives a DIFFERENT media ecosystem
# than "get a good SWE job" would. It says product company (not quant fund, not PhD lab),
# new-grad pipeline (campus + aggregators, not executive search), and builder-proof
# (GitHub + portfolio case studies, not papers). The ecosystems differ -> Q1 passes.

audience:
  # Picked for truth, not flattery. "Both, but weighted" — primary drives the system;
  # secondary is where my Savor/AI pivot is the differentiator.
  - who: recruiters & hiring managers (new-grad / early-career SWE at product companies)
    weight: PRIMARY
    they_care_about: >-
      Can this person clear our screen and own real work fast? They read for: a passable
      online assessment, evidence of shipping (not just coursework), measurable impact,
      and a referral or campus signal that de-risks the bet.
  - who: AI-first startups & founders / AI-eng hiring managers
    weight: SECONDARY
    they_care_about: >-
      Can they build a product feature on top of LLMs without a senior holding their hand?
      They reward shipped RAG/eval/MCP work, a runnable demo, and a clear write-up far more
      than a long skills list. This is where my Savor experience out-signals other new grads.

# Assignment 1 Part 1B — market evidence (from my Figma board, postings reviewed May 2025).
# Keyed to the audience above: this is WHY the audience read is mine, not generic.
market_evidence:
  postings_reviewed:
    sources: ["Google", "Meta", "Stripe", "Atlassian", "HubSpot"]
    reviewed: "2025-05  [Assignment 1 Part 1B / Figma board]"
    skills_demanded:
      technical: ["React / TypeScript", "System design at scale", "Cloud (AWS / GCP)", "CI/CD pipelines"]
      emerging: ["LLM / AI integration", "RAG & vector search"]
      soft: ["Ownership mindset", "Cross-team collaboration"]
    read: >-
      These five product-company postings key the audience to MY targets, not generic new-grad
      conventions. The split matters: the technical bar (React/TS, cloud, CI/CD) I already
      evidence in resume.json; the emerging bar (LLM/AI, RAG) is where Savor out-signals other
      new grads; "system design at scale" is the one I do NOT yet prove — it stays in gaps.md
      (interview-screen readiness), never in unique_attributes.

positioning:
  # April Dunford, *Obviously Awesome* — positioning as context-setting, adapted to a
  # person: win a narrow frame where you're an obvious choice instead of competing in the
  # crowded "software engineer" pool where a new grad blends in.
  frame: "The new grad who has already shipped — full-stack + mobile + a real AI-product layer"

  competitive_alternatives:
    # Who a hiring manager considers instead if I didn't exist.
    - "CS new grads with strong DSA/LeetCode but little or no shipped production work — they win the screen, I win the 'can own a feature day one' read."
    - "Bootcamp / generalist new grads with one stack — cheaper to slot, but single-platform; I cover mobile AND web AND backend."
    - "Mid-level mobile or full-stack contractors — more experience, but expensive and not on a new-grad req; I'm the new-grad-budget version of 'already done it'."
    - "Other MS-IS students whose résumé is coursework + class projects — I have 2018–2024 industry roles behind the degree."

  unique_attributes:
    # Each attribute MUST cite resume.json proof. No proof -> it's in gaps.md, not here.
    - attribute: "Ships across the full stack AND both mobile platforms — not a single-stack new grad"
      weight: PRIMARY
      proof:
        - "experience[BlueBox Infosoft]: 5+ cross-platform Flutter apps, owned UI→backend→release"
        - "experience[Savor]: React Native + TypeScript mobile features, iOS & Android"
        - "experience[Tridhya]: React.js / JSP web UIs + Liferay portals"
        - "experience[DishaSoft]: Java/Spring Boot backend + microservices"
      vs: "A bootcamp or CS-coursework new grad usually has one stack; I've shipped mobile, web, and backend in production."
    - attribute: "Has already built production AI-product features — not just coursework AI"
      weight: PRIMARY
      proof:
        - "experience[Savor]: semantic search via LLM APIs + embeddings + retrieval, ~85% relevance over 10K+ eval queries"
        - "experience[Savor]: MCP (Model Context Protocol) for context retrieval in a Node/PostgreSQL backend"
        - "skills.ai_ml: RAG, embeddings, vector search, evals, MCP"
      vs: "Most new grads list 'AI' as a course or a tutorial; I shipped retrieval + evals + MCP into a real app."
    - attribute: "Measurable production-performance instinct across every role"
      proof:
        - "experience[Savor]: ~35% lower API latency at 99.5% uptime; app load under 2s"
        - "experience[BlueBox]: ~30% faster startup/screen-load via lazy loading + profiling"
        - "experience[DishaSoft]: ~40% higher throughput via microservices; projects: 3x baseline traffic at zero downtime"
      vs: "I don't just make it work — I make it measurably faster, and I can cite the number."
    - attribute: "Real multi-year industry track record behind the new-grad label"
      proof:
        - "experience[DishaSoft]: 2018-08 → 2019-10"
        - "experience[BlueBox Infosoft]: 2023-10 → 2024-07"
        - "experience[Tridhya]: 2022-12 → 2023-05"
      vs: "A new grad whose only experience is internships reads as higher-risk; I've held full engineering roles."

  # Attributes I do NOT get to claim yet (no resume.json proof) — moved to gaps.md:
  #   - "Strong DSA / system-design interview performance"  (no evidence; it's the screen I must pass)
  #   - "A public portfolio of adopted, documented project repos"  (portfolio + repos exist but use/links unevidenced)
  #   - "Recognized AI engineer / technical writer"  (no published writing yet)

  who_cares_most: >-
    The slice that values my uniqueness highest is the AI-first product startup hiring a
    new grad to OWN a feature end to end — they pay the biggest premium for "ships full-stack
    + already did production AI." The broad recruiter pipeline values the shipping + measurable
    impact + multi-year track record; the AI niche values the Savor AI-product layer most.

  one_line:
    recommended: >-
      I'm a full-stack and mobile engineer who has already shipped — Flutter and React Native
      apps, Node/Java backends, and a production AI search layer — so I can own a product
      feature end to end on day one, not after a year of ramp.
    alternates:
      - "Most new grads have coursework; I have five years of shipped mobile, web, and backend — plus a real RAG/MCP feature in production."
      - "Full-stack + mobile + a working AI-product layer: the new grad who's already done the job."

media:
  # Cited media-target map (rubric lines 6 & 7). Spine: for a new-grad SWE, HIRING is gated
  # by referrals, campus pipelines, and online assessments — NOT by social reach. Every kept
  # entry has a CITED reason + a role (discovery / proof / voice / conversion) + a win condition.
  # Where a claim is my own reasoning rather than a source, it's labeled [inference].

  - channel: "Employee referrals / warm network (alumni, ex-colleagues, NEU peers)"
    role: "discovery + conversion (highest-yield)"
    audience: "recruiters & hiring managers (PRIMARY)"
    cited_reason: >-
      Referrals are the single highest-converting channel: referred candidates are ~7x more
      likely to be hired than job-board applicants (Pinpoint, 4.5M applications), and referrals
      are consistently the top source of quality hires (SHRM). [Pinpoint; SHRM]
    win_condition: "≥1 warm referral attached to most target applications; track referral-to-interview rate"

  - channel: "LinkedIn (profile as the recruiter-search index, not a content feed)"
    role: "discovery (recruiter inbound) + proof of trajectory"
    audience: "recruiters & hiring managers (PRIMARY)"
    cited_reason: >-
      The new-grad SWE pool is dominated by full-stack/back-end roles (top two developer roles
      six years running, Stack Overflow 2024) and recruiters search profiles for exactly those
      keywords; the profile is the index, so it must read 'full-stack/mobile SWE,' not a vibe. [Stack Overflow 2024]
    win_condition: "relevant recruiter InMails; profile headline + skills aligned to the aspiration; not measured in followers"

  - channel: "GitHub — active, documented repos (USE & contribution history, NOT stars)"
    role: "proof"
    audience: "AI-eng hiring managers & founders (SECONDARY); technical screeners (PRIMARY)"
    cited_reason: >-
      Engineering audiences read code, and the live new-grad req feeds themselves run on GitHub
      (SimplifyJobs/New-Grad-Positions, jobright-ai/2026-Software-Engineer-New-Grad) — it's the
      shared substrate of this ecosystem. Stars are weak/gameable; documented, runnable repos are the signal. [SimplifyJobs; jobright-ai; Stack Overflow 2024]
    win_condition: "2–3 polished repos mirroring the Savor AI-search + voice-analytics work, with READMEs + run instructions, linked from the résumé"

  - channel: "Handshake + Northeastern career fairs / campus recruiting"
    role: "discovery (structured new-grad pipeline)"
    audience: "recruiters & hiring managers (PRIMARY)"
    cited_reason: >-
      Handshake is the largest early-talent recruiting network and the #1 way college students
      find jobs; campus fairs are the structured channel employers use specifically to hire new grads. [Handshake]
    win_condition: "fair conversations → onsite invites; same-semester applications to early-career reqs"

  - channel: "New-grad job aggregators on GitHub (SimplifyJobs/New-Grad-Positions, jobright-ai/2026)"
    role: "discovery (speed to fresh reqs)"
    audience: "recruiters & hiring managers (PRIMARY)"
    cited_reason: >-
      These community-maintained GitHub lists surface live 2026 new-grad SWE openings in near
      real time — the fastest discovery layer for this exact role, far ahead of generic boards. [SimplifyJobs; jobright-ai]
    win_condition: "applications within days of a posting going live (early-applicant advantage)"

  - channel: "LeetCode / HackerRank practice + online assessments"
    role: "proof (clearing the gate)"
    audience: "technical screeners (PRIMARY)"
    cited_reason: >-
      The new-grad SWE funnel runs through an online coding assessment before any human review —
      e.g. Google's new-grad process opens with an online coding challenge, then onsites (Glassdoor),
      and pre-employment coding tests are a top employer screen (HackerRank). [Glassdoor; HackerRank]
    win_condition: "consistently clear OAs and first technical screens for target companies"

  - channel: "Personal portfolio (kanishk-personalportfolio.netlify.app) — case studies, not a brochure"
    role: "proof + voice"
    audience: "AI-eng hiring managers & founders (SECONDARY)"
    cited_reason: >-
      For the AI-first/founder audience, a runnable demo + a clear architecture write-up out-signals
      a skills list; my portfolio is the asset I already own to host that. [inference — keyed to the SECONDARY audience's stated read]
    win_condition: "2–3 case studies (Savor AI search; voice analytics) with architecture + measurable outcomes, linked in applications"

  - channel: "Short technical write-ups / build-in-public (dev blog or LinkedIn long-form, sparingly)"
    role: "voice (secondary only)"
    audience: "AI-eng hiring managers & founders (SECONDARY)"
    cited_reason: >-
      Turning one shipped feature (e.g. MCP context retrieval) into a teachable post is a low-cost
      credibility signal to builder audiences. [inference — not a primary hiring channel; deliberately capped]
    win_condition: "1–2 posts that each map to a real shipped artifact; abandon if it competes with portfolio/GitHub time"

# --- media CUT / deprioritize (rubric line 7 — every rejection keeps its reason) ---
media_cut:
  - "Instagram / TikTok / general social posting — SWE hiring conversations don't happen there; reach is not a hire signal for engineers, and referrals/screens decide outcomes. [inference from Pinpoint/SHRM channel evidence]"
  - "Mass cold applications to generic job boards (Indeed, etc.) as the PRIMARY bet — lowest-yield channel; referrals convert ~7x better, so boards stay only as a discovery feed via the GitHub aggregators. [Pinpoint]"
  - "GitHub star-chasing — stars are a weak, gameable proxy; the real signal is documented, runnable code + a green contribution history. [inference; Stack Overflow 2024]"
  - "Twitter/X 'AI influencer' posting as a strategy — for a new-grad SWE the gates are referrals, OAs, and campus pipelines, not follower count; this is the round-one trap the exercise warns about. [inference]"
  - "LeetCode grind as the ONLY preparation — a necessary gate, not a differentiator; over-indexing on it crowds out the portfolio + shipped-AI proof that actually separates me from the CS-coursework pool. [inference]"
